<p style="margin: 0; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 8px; height: 8px; background: var(--accent)"></span>Case study · Flutter UKI Customer · 2025–present</p>
<h1 data-reveal="r1" data-in="{{rv.r1}}" style="margin: 0; font-family: 'Geist', sans-serif; font-weight: 400; font-size: var(--fs-d); line-height: 1.0; letter-spacing: -0.02em; max-width: 1280px"><span class="w" style="--i:0">Growing</span> <span class="w" style="--i:1">a</span> <span class="w" style="--i:2">design</span> <span class="w" style="--i:3">team</span> <span class="w" style="--i:4">from</span> <span class="w" style="--i:5">4</span> <span class="w" style="--i:6">to</span> <span class="w" style="--i:7">9</span> <span class="w" style="--i:8">to</span> <span class="w" style="--i:9">support</span> <span class="w" style="--i:10">28</span> <span class="w" style="--i:11">squads</span></h1>
<p style="margin: 0; max-width: 900px; font-family: 'Geist', sans-serif; font-size: var(--fs-2); line-height: 1.25; letter-spacing: -0.02em">How I used AI to cut through complexity, and brought structure, visibility and a leadership layer to a small design team serving four product tribes.</p>
</div>
<div class="sum" role="list" aria-label="Summary"><div role="listitem"><b>9</b><span>designers, up from 4, with two lead-level managers</span></div><div role="listitem"><b>28</b><span>squads across four tribes</span></div><div role="listitem"><b>4</b><span>tribes, each with its own front door</span></div></div>
</section>

<section class="snap prose" aria-labelledby="ch-h">
<h2 id="ch-h" class="pr-h">The challenge</h2>
<p>After 11 years in Sport, I moved into Customer. Once the Sky Bet migration finished, each of Customer’s four tribes had seven squads ready to go, and there were four designers. Requests went straight to designers, and with no structure I had to be hands-on everywhere. That built context fast, but it wasn’t sustainable.</p>
</section>
<section class="snap prose" aria-labelledby="role-h">
<h2 id="role-h" class="pr-h">My role</h2>
<p>As Senior Design Manager, I lead product and content design for Customer, line-manage two leads, and agree priorities with the leadership of each tribe, within a UK and Ireland design organisation of nearly 70.</p>
</section>

<section class="snap prose" aria-labelledby="ap-h">
<h2 id="ap-h" class="pr-h">The approach</h2>
<ol class="pr-steps"><li><h3>A front door for every tribe</h3><p>Requests come through one channel, then a quick call with the designer and product manager, a ticket on the roadmap and a kick-off.</p></li><li><h3>Make capacity visible</h3><p>Roadmaps are open to the whole tribe, so product can see where new work will realistically land. Prioritisation moved into product sessions.</p></li><li><h3>Build a leadership layer</h3><p>I told my Head of Design and MD the team was too thin. We grew to nine through hiring and promotion: a mid-level designer became senior, and a senior became a lead.</p></li><li><h3>Bring in service design</h3><p>I’ve pushed the team to lead on service design methods. An alignment workshop I ran brought senior stakeholders together on a large initiative.</p></li></ol>
</section>

<section class="snap prose" aria-labelledby="ai-h">
<h2 id="ai-h" class="pr-h">AI in practice</h2>
<p class="pr-lead">A single source of truth, built with AI.</p><p>Our documentation was scattered, and much of the work involves a complex internal tool. I built a skill in an internal Claude-powered tool, loaded it with everything we had and set clear rules for how it behaves. A lead and two designers use it regularly to get to the heart of problems, and it helped me plan that workshop.</p><p>I’ve also connected our three Jira tools with AI, so work flows from discovery through to delivery.</p>
</section>

<section class="snap prose" aria-labelledby="kd-h">
<h2 id="kd-h" class="pr-h">Key decision</h2>
<p class="pr-lead">Spend my time where the team was least experienced.</p><p>With 28 squads and a handful of designers, I couldn’t be everywhere. Two tribes had experienced designers, so I focused hands-on support where people were newer, and used the roadmaps to make the case for growing the team quickly.</p>
</section>


<section class="snap prose" aria-labelledby="lt-h">
<h2 id="lt-h" class="pr-h">Leading the team</h2>
<p class="pr-lead">A leadership layer, and a weekly pulse on how people are doing.</p><p>I line-manage the two leads, one promoted from within and one hired externally, and they manage their own teams. That frees me to work on priorities with tribe leadership.</p><p>I also set up a weekly check-in in Slack, so anyone can raise a blocker or ask for support without waiting for a one-to-one.</p>
</section>

<section class="snap prose" aria-labelledby="kr-h">
<h2 id="kr-h" class="pr-h">Results</h2>
<dl class="pr-res"><div><dt>9</dt><dd>Designers in the team, up from 4 when I joined in 2025.</dd></div><div><dt>4</dt><dd>Tribes with their own front door.</dd></div><div><dt>2</dt><dd>Leads, one promoted from within.</dd></div><div><dt>28</dt><dd>Squads supported across Customer.</dd></div></dl><ul class="pr-list"><li>The design leadership team adopted the roadmap approach in other areas of the business.</li><li>In 2026, bringing teams onto one connected Jira workflow, from discovery to services.</li></ul>
</section>

<section class="snap prose" aria-labelledby="wl-h">
<h2 id="wl-h" class="pr-h">What I learned</h2>
<p class="pr-lead" data-reveal="r2" data-in="{{rv.r2}}">A new area needs a fresh approach, not a copy of what worked before.</p><p>When everyone can see the roadmap, prioritisation becomes a shared decision.</p>
</section>

<section class="snap prose pr-end" aria-labelledby="dd-h">
<h2 id="dd-h" class="pr-h">What I’d do differently</h2>
<p class="pr-lead">Set up the structure from day one.</p><p>I’d put the front door and the leadership structure in place straight away, and give earlier hands-on support to designers newer to working at this scale.</p>
</section>
