<h1 data-reveal="r1" data-in="{{rv.r1}}" style="margin: 0; font-family: 'Geist', sans-serif; font-weight: 400; font-size: var(--fs-d); line-height: 1.0; letter-spacing: -0.02em; max-width: 1280px"><span class="w" style="--i:0">Leadership</span> <span class="w" style="--i:1">Loop:</span> <span class="w" style="--i:2">remembering</span> <span class="w" style="--i:3">what</span> <span class="w" style="--i:4">matters</span> <span class="w" style="--i:5">between</span> <span class="w" style="--i:6">1:1s</span></h1>
<p class="cs-sub">A prototype for better 1:1s, designed and built with AI.</p>
<p style="margin: 0; max-width: 900px; font-family: 'Geist', sans-serif; font-size: var(--fs-2); line-height: 1.25; letter-spacing: -0.02em">A prototype I designed and built with AI, so managers carry context from one conversation to the next and keep their promises, in both directions.</p>
</div>
</section>

<section class="snap" style="padding: 20px">
<figure class="fig" style="padding: 0">
<img class="shot" src="/assets/963452ed986e63d5287e19d37b02930e.jpg" alt="Alex Morgan's person page in the working dashboard: what's happening right now, what's on Alex's mind, and promises in both directions" width="1600" height="1111">
<figcaption>The working dashboard: a person's page shows what's on their mind and the promises between you, each linked to what was said.</figcaption>
</figure>
</section>

<section class="snap prose" aria-labelledby="ch-h">
<p class="pr-eye">Where it started</p><h2 id="ch-h" class="pr-h">The challenge</h2>
<p class="pr-lead">1:1s are where most management happens, and they’re surprisingly fragile.</p><p>What someone raised three weeks ago rarely makes it into today’s conversation. Managers lose track of their own promises, and when one slips, trust erodes quietly. Praise sits in Slack, goals in a document and progress in people’s heads.</p><p>Most tools focus on agendas or reviews. I wanted to explore memory and accountability in service of the conversation.</p>
</section>

<section class="snap prose" aria-labelledby="role-h">
<p class="pr-eye">What I owned</p><h2 id="role-h" class="pr-h">My role</h2>
<p>A solo project, built with Claude Code and Next.js. I framed the problem, set the principles and wrote the requirements, including the rules for evidence, approval and wellbeing. I directed Claude to build it phase by phase, challenged every output, and turned gaps found in testing into rule changes. The AI wrote the code and first drafts; the direction and the decisions were mine.</p>
</section>

<section class="snap prose" aria-labelledby="hw-h">
<p class="pr-eye">The idea</p><h2 id="hw-h" class="pr-h">How it works</h2>
<p>A coaching workflow in Claude Code and a dashboard for the manager. Nothing changes anyone’s record without the manager’s approval.</p><ol class="pr-steps"><li><h3>Prepare</h3><p>A short briefing, built only from what was already on record.</p></li><li><h3>Reconcile</h3><p>Compares the new transcript with the record.</p></li><li><h3>Propose</h3><p>Shows each change with the quote behind it.</p></li><li><h3>Apply</h3><p>Saves only the changes the manager approves.</p></li></ol>
</section>

<section class="snap" aria-labelledby="wk-h" style="border-top: 1px solid var(--line)">
<h2 id="wk-h" style="margin: 0; padding: 32px 20px 24px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em">The working prototype</h2>
<div class="cols cols-3" style="background: var(--line); border-top: 1px solid var(--line)">
<figure class="fig"><img class="shot" src="/assets/f4343d8e802b3fe3f79bd3ece07ec4d5.jpg" alt="Prepare screen for a 1:1 with Alex: follow-ups, things to celebrate and folded extras" width="1600" height="1111" loading="lazy"><figcaption><strong>Prepare 1:1.</strong> One screen. Alex leads; this is a memory aid.</figcaption></figure>
<figure class="fig"><img class="shot" src="/assets/1da7a549f10c7cc34a8e0eb61bcbda05.jpg" alt="Review updates, step one: what changed since the last approved record" width="1600" height="1111" loading="lazy"><figcaption><strong>Review updates.</strong> Five short steps. Nothing changes the record until you approve.</figcaption></figure>
<figure class="fig"><img class="shot" src="/assets/7db93dc4f4c05aa38416ce79c9cecf8a.jpg" alt="My Commitments: what the manager promised each person, grouped by due soon and did this happen" width="1600" height="1111" loading="lazy"><figcaption><strong>My Commitments.</strong> What you promised, with fair wording like “Past due. Did it happen?”</figcaption></figure>
</div>
</section>

<section class="snap prose" aria-labelledby="pr-h">
<p class="pr-eye">Ground rules</p><h2 id="pr-h" class="pr-h">Principles I designed to</h2>
<ul class="pr-list"><li><strong>Employee-led.</strong> The 1:1 belongs to the person; the tool is a memory aid, never an agenda.</li><li><strong>Coaching, not evaluating.</strong> No ratings, rankings or promotion calls.</li><li><strong>Trust through accuracy.</strong> Every point links to what was said.</li><li><strong>Accountability both ways.</strong> The manager’s promises are tracked too, and shown first.</li><li><strong>Recognition as celebration,</strong> never as a score.</li><li><strong>Care with personal information.</strong> Only work points people choose to share, in their own words.</li></ul>
</section>

<section class="snap prose" aria-labelledby="ap-h">
<p class="pr-eye">How we worked</p><h2 id="ap-h" class="pr-h">The approach</h2>
<ol class="pr-steps"><li><h3>Fictional data first</h3><p>A made-up team let me test sensitive moments safely, like a missed promise or a private flexibility request.</p></li><li><h3>Test, then tighten the rules</h3><p>A completeness check I added found four missing commitments where the first test found one.</p></li><li><h3>Redesign around three questions</h3><p>Who needs my attention? What do I need to remember? What do I do next? The 1:1 briefing went from 840 words to 214.</p></li><li><h3>Learn from what’s live</h3><p>I studied real screens from 15Five, Fellow, Lattice and others, then chose a direction from three options.</p></li></ol>
</section>

<section class="lrn snap" aria-labelledby="re-h" style="border-top: 1px solid var(--line)">
<h2 id="re-h" style="margin: 0; padding: 32px 20px 24px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em">The redesign</h2>
<p style="margin: 0; padding: 0 20px 32px; max-width: 900px; font-family: 'Geist', sans-serif; font-size: var(--fs-2); line-height: 1.25; letter-spacing: -0.02em">The first version worked, but it looked generic and gave every section the same card. I ran a competitor analysis of similar tools, chose a panel grid, and restyled the whole app to feel more intuitive.</p>
<div class="cols cols-2" style="background: var(--line); border-top: 1px solid var(--line)">
<figure class="fig"><img class="shot" src="/assets/01bd3082e81bac4c28fe4aaae74d1e13.jpg" alt="Earlier Home screen: warm cream background, indigo buttons and a card around every section" width="1440" height="1000" loading="lazy"><figcaption><strong>Before.</strong> Cream background, indigo buttons, and the same card around everything.</figcaption></figure>
<figure class="fig"><img class="shot" src="/assets/b8b4e09d579f8e5d5f445a2d4091e978.jpg" alt="Redesigned Home screen: white page, grey sidebar and sections as panels with icon headers" width="1600" height="1111" loading="lazy"><figcaption><strong>After.</strong> A white page, a quiet sidebar, and each section as a panel with its own icon and count.</figcaption></figure>
</div>
</section>

<section class="snap prose" aria-labelledby="kd-h">
<p class="pr-eye">The big calls</p><h2 id="kd-h" class="pr-h">Key decisions</h2>
<ol class="pr-steps"><li><h3>Simplify rather than show everything</h3><p>All the evidence stays, behind a “Why?” that shows the exact quote.</p></li><li><h3>No automatic record updates</h3><p>Until there’s sign-in and consent, changes only happen in a confirmed step.</p></li><li><h3>Accountability without blame</h3><p>Past-due promises ask “Did it happen?” rather than being marked as missed.</p></li><li><h3>Privacy by leaving things out</h3><p>Wellbeing details and personal reasons are never kept, and people are never ranked.</p></li></ol>
</section>

<section class="lrn snap" aria-labelledby="nx-h" style="border-top: 1px solid var(--line)">
<h2 id="nx-h" style="margin: 0; padding: 32px 20px 24px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em">Next: a two-sided 1:1</h2>
<p data-reveal="r2" data-in="{{rv.r2}}" style="margin: 0; padding: 0 20px 24px; max-width: 1200px; font-family: 'Geist', sans-serif; font-weight: 400; font-size: var(--fs-1); line-height: 1.12; letter-spacing: -0.02em"><span class="w" style="--i:0">If</span> <span class="w" style="--i:1">the</span> <span class="w" style="--i:2">1:1</span> <span class="w" style="--i:3">belongs</span> <span class="w" style="--i:4">to</span> <span class="w" style="--i:5">the</span> <span class="w" style="--i:6">person,</span> <span class="w" style="--i:7">they</span> <span class="w" style="--i:8">should</span> <span class="w" style="--i:9">see</span> <span class="w" style="--i:10">it</span> <span class="w" style="--i:11">too.</span></p>
<p style="margin: 0; padding: 0 20px 32px; max-width: 900px; font-size: var(--fs-b); line-height: 1.55; color: var(--muted)">I took the best patterns from products already live and combined them with Leadership Loop’s principles: a catch-up before each 1:1, one shared page per relationship, a short check-in from the person, and a long-term view of goals and recognition. The new part is the person’s own dashboard, where they can hold their manager to account and correct what’s on their record.</p>
<div style="padding: 0 20px 20px">
<figure class="fig" style="padding: 0"><img class="shot" src="/assets/778afe854c65db364bd9713567b0c835.jpg" alt="Concept manager home: up next with a catch-up, promises both ways, check-ins from the team, items waiting for approval, and the team over time" width="1600" height="1461" loading="lazy"><figcaption><strong>Manager home.</strong> A catch-up before each 1:1, promises in both directions, and your team over time, built from approved records with no scores.</figcaption></figure>
</div>
<div class="cols cols-2" style="background: var(--line); border-top: 1px solid var(--line)">
<figure class="fig"><img class="shot" src="/assets/658e9fbefb066de0aa0c6f10398b4611.jpg" alt="Shared 1:1 page: agenda both people add to, Alex's check-in and private notes" width="1600" height="1213" loading="lazy"><figcaption><strong>One shared page per relationship.</strong> An agenda you both add to, the person’s check-in in their own words, and private notes only you see.</figcaption></figure>
<figure class="fig"><img class="shot" src="/assets/8ebb15125aa7b5caf4249848825b7f10.jpg" alt="Goals over time: a timeline from June to November with each goal's status and its history" width="1600" height="1285" loading="lazy"><figcaption><strong>Goals over time.</strong> Every goal with its status (achieved, in progress, open or paused) and the history behind it, starting from what the person said they wanted.</figcaption></figure>
<figure class="fig"><img class="shot" src="/assets/00df7f52be77a0c2e94d2ad2f2e1a66f.jpg" alt="Recognition history: shout-outs grouped by month, with source and linked goal" width="1600" height="1000" loading="lazy"><figcaption><strong>Recognition history.</strong> Every shout-out by month, where it came from, and the goal it relates to. To celebrate, not to score.</figcaption></figure>
<figure class="fig"><img class="shot" src="/assets/af3bad1d0d6cba0fb2cd61032b58f35d.jpg" alt="The direct report's own dashboard: check-in before the 1:1, what the manager promised, goals, record and recognition" width="1600" height="1788" loading="lazy"><figcaption><strong>The person’s own view.</strong> A two-minute check-in with no mood score, what their manager promised, and their record, which they can confirm or correct.</figcaption></figure>
</div>
<p style="margin: 0; padding: 20px 20px 32px; font-size: 13px; color: var(--muted2); border-top: 1px solid var(--line)">Concept screens. Patterns studied from 15Five, Fellow, Lattice, Topicflow, Windmill and Aboard. All people and content are fictional.</p>
</section>

<section class="snap prose" aria-labelledby="vf-h">
<p class="pr-eye">Proof</p><h2 id="vf-h" class="pr-h">What I verified</h2>
<dl class="pr-res"><div><dt>0</dt><dd>Automated accessibility issues across 41 page states.</dd></div><div><dt>223</dt><dd>Cited quotes checked word for word against their sources.</dd></div><div><dt>53</dt><dd>Protected records unchanged after every test.</dd></div></dl><p>No real managers have used it yet, so there’s no evidence of impact on 1:1s. That’s what I’d test next.</p>
</section>

<section class="snap prose pr-end" aria-labelledby="dn-h">
<p class="pr-eye">Next steps</p><h2 id="dn-h" class="pr-h">What I’d do next</h2>
<p class="pr-lead">Put it in front of real managers.</p><ul class="pr-list"><li>Usability sessions with 5–8 people managers.</li><li>Run the coaching workflow live as notes are added.</li><li>Sign-in, consent and retention rules before any real data.</li><li>Build the person’s side as a hosted app.</li></ul>
</section>
