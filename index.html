  }
  componentDidUpdate() {
    this._scan();
  }
  componentWillUnmount() {
    clearTimeout(this._t);
    if (this._io) this._io.disconnect();
    if (this._out) this._out.disconnect();
    if (this._spy) this._spy.disconnect();
    if (this._navClick) document.removeEventListener('click', this._navClick);
  }
  _scan() {
    if (this._io) document.querySelectorAll('[data-reveal]').forEach((el) => {
      this._io.observe(el);
      this._out.observe(el);
    });
    if (this._spy) document.querySelectorAll('[data-nav]').forEach((el) => this._spy.observe(el));
  }
  renderVals() {
    const seen = this.state.rv || {};
    const rv = {};
    ['r1','r2','r3','r4','r5','r6','r7','r8'].forEach((k) => { rv[k] = seen[k] ? '1' : '0'; });
    const a = this.state.active || 'home';
    const item = (k) => ({ bg: a === k ? 'var(--ink)' : 'transparent', fg: a === k ? 'var(--bg)' : 'var(--ink)', cur: a === k ? 'true' : 'false' });
    return {
      accent: this.props.accent ?? '#C2410C',
      rv,
      nav: { home: item('home'), work: item('work'), about: item('about'), contact: item('contact') }
    };
  }
}
</script>
<script src="/dc.js"></script>
</body>
</html>
