<h1 data-reveal="r1" data-in="{{rv.r1}}" style="margin: 0; font-family: 'Geist', sans-serif; font-weight: 400; font-size: var(--fs-d); line-height: 1.0; letter-spacing: -0.02em; max-width: 1280px"><span class="w" style="--i:0">Merging</span> <span class="w" style="--i:1">two</span> <span class="w" style="--i:2">design</span> <span class="w" style="--i:3">teams</span> <span class="w" style="--i:4">to</span> <span class="w" style="--i:5">move</span> <span class="w" style="--i:6">9</span> <span class="w" style="--i:7">million</span> <span class="w" style="--i:8">customers</span> <span class="w" style="--i:9">onto</span> <span class="w" style="--i:10">one</span> <span class="w" style="--i:11">platform</span></h1>
<p style="margin: 0; max-width: 900px; font-family: 'Geist', sans-serif; font-size: var(--fs-2); line-height: 1.25; letter-spacing: -0.02em">How I brought Sky Bet and Betfair designers together, delivered a platform migration on an 18-month deadline, and restored Sky Bet’s character when customers missed it.</p>
</div>
<div class="sum" role="list" aria-label="Summary"><div role="listitem"><b>9m</b><span>customers moved onto the shared platform</span></div><div role="listitem"><b>1 <small>team</small></b><span>formed from the Sky Bet and Betfair design teams, with a lead from each</span></div><div role="listitem"><b>18 <small>months</small></b><span>fixed deadline, met</span></div></div>
</section>

<section class="snap prose" aria-labelledby="ch-h">
<h2 id="ch-h" class="pr-h">The challenge</h2>
<p>Sky Bet, the group’s largest brand, had 18 months to move onto the platform first built for Betfair. Half the design team I took on came from Sky Bet and worked very differently. “This is not how we do it at Sky Bet” was a fair reaction, and some stakeholders were harder to bring along than the designers.</p>
</section>

<section class="snap prose" aria-labelledby="role-h">
<h2 id="role-h" class="pr-h">My role</h2>
<p>I was brought in as Senior Design Manager to lead design through the migration, drawing on the Betfair rebuild. I spent my first two months aligning how product, design and engineering worked, then led the sports design team and owned the UX/UI and prioritisation workstreams.</p>
</section>

<section class="snap prose" aria-labelledby="ap-h">
<h2 id="ap-h" class="pr-h">The approach</h2>
<ol class="pr-steps"><li><h3>Set the operating model</h3><p>Templated user stories didn’t land, so every ticket became a hub linking to the Confluence pages product and engineering already used.</p></li><li><h3>Make progress visible</h3><p>Workstream sessions and fortnightly sports-wide reviews kept decisions on track. People were won over by seeing the benefits, not by being told.</p></li><li><h3>Build one team</h3><p>Stand-ups, peer reviews, retros and weekly health checks, with one-to-ones and engagement surveys telling us when to change how we worked.</p></li><li><h3>Release in stages</h3><p>Releasing to small groups of customers first meant feedback arrived while there was still time to act on it.</p></li></ol>
</section>

dden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></button><span class="jm-dots" aria-hidden="true"><span class="jm-dot" data-on="{{jm.d1}}"></span><span class="jm-dot" data-on="{{jm.d2}}"></span><span class="jm-dot" data-on="{{jm.d3}}"></span><span class="jm-dot" data-on="{{jm.d4}}"></span><span class="jm-dot" data-on="{{jm.d5}}"></span><span class="jm-dot" data-on="{{jm.d6}}"></span></span><button type="button" class="jm-btn" data-jm-act="next" aria-label="Next step"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button></div><button type="button" class="jm-open" data-jm-act="open">Open the journey map<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button><p class="jm-hint">Swipe the phones or use the arrows.</p></div></div>

<section class="snap prose" aria-labelledby="kd-h">
<h2 id="kd-h" class="pr-h">Key decision</h2>
<p class="pr-lead">Ship Betfair in blue, then bring Sky Bet back.</p><p>Leadership chose a quick reskin so we could test the product with customers early. I backed it, as the old app was still live during beta. Feedback was clear: it felt like Betfair in blue.</p><p>So design and product audited the old app to pin down what made it feel like Sky Bet. That set the brief for a second phase: blue mastheads, the promotions carousel and the Sky Bet font first, then the content hierarchy, the bet slip and My Bets.</p>
</section>

<p id="ba-h" style="margin: 0; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em"><span aria-hidden="true" style="width: 8px; height: 8px; background: var(--accent)"></span>Before and after · Sky Bet, 2023 to 2025</p>

</section>

<section class="snap prose" aria-labelledby="lt-h">
<h2 id="lt-h" class="pr-h">Leading the team</h2>
<p class="pr-lead">One team, with a lead from each side.</p><p>I started with one lead. Six months in, I made the case for a second, so both the Sky Bet and Betfair designers had a lead they trusted. The core team of ten worked alongside dedicated researchers and design system designers.</p><p>Health checks and one-to-ones told me when a process wasn’t helping, and I changed it. By 2025, the leads were resolving issues directly with each other.</p>
</section>

<section class="snap prose" aria-labelledby="kr-h">
<h2 id="kr-h" class="pr-h">Results</h2>
<dl class="pr-res"><div><dt>9m</dt><dd>Sky Betting &amp; Gaming customers moved onto the shared platform in 2025.</dd></div><div><dt>18 months</dt><dd>To deliver the migration on deadline, including a second phase that brought back Sky Bet’s character.</dd></div><div><dt>10</dt><dd>Designers in one team, half from Sky Bet and half from Betfair.</dd></div><div><dt>2</dt><dd>Leads, one from each side, after I made the case for an org change.</dd></div></dl><ul class="pr-list"><li>The staged rollout caught the “doesn’t feel like Sky Bet” feedback before full launch.</li><li>Other design teams adopted our ticket approach and team health checks.</li></ul>
</section>

<section class="snap prose" aria-labelledby="wl-h">
<h2 id="wl-h" class="pr-h">What I learned</h2>
<p class="pr-lead" data-reveal="r2" data-in="{{rv.r2}}">Change lands when people can see how it helps them.</p><p>Brand is part of the experience, too. A reskin wasn’t enough for customers loyal to Sky Bet.</p>
</section>

<section class="snap prose pr-end" aria-labelledby="dd-h">
<h2 id="dd-h" class="pr-h">What I’d do differently</h2>
<p class="pr-lead">Understand how things work before changing them.</p><p>I’d spend longer understanding existing processes and ways of working before bringing in change.</p>
</section>

/span>The Sky Bet look is back: blue masthead, shortcuts, a promotion, then quick links.</li></ul></article><article class="jm-col" data-jm-col="1"><p class="jm-step">02</p><h3 class="jm-title">Football</h3><div class="jm-pair"><figure><div class="jm-mini"><img src="/assets/860d919fa3723979e3d2b49ccf9c74dd.jpg" alt="Sky Bet: Football" data-zoom loading="lazy"></div><figcaption>Sky Bet</figcaption></figure><figure><div class="jm-mini"><img src="/assets/8448236431185cc834165a0bda25fd4a.jpg" alt="Betfair: Football" data-zoom loading="lazy"></div><figcaption>Betfair</figcaption></figure><figure><div class="jm-mini"><img src="/assets/b53602d3d28b8a37ce35f3e8d3a32973.jpg" alt="Sky Bet today: Football" data-zoom loading="lazy"></div><figcaption>Sky Bet today</figcaption></figure></div><ul class="jm-notes"><li><span class="jm-tag jm-sb">Sky Bet</span>A landing page for each market coupon.</li><li><span class="jm-tag jm-bf">Betfair</span>Straight into coupons, with popular bet builders showing how often they’ve been backed.</li><li><span class="jm-tag jm-research">Research</span>Customers wanted popular bets backed by what other customers are doing.<q class="jm-q">A number that says 7000 people have added to bet slip, something that will encourage me that it is popular</q></li><li><span class="jm-tag jm-td">Today</span>Football has its own home again, with tabs for in-play, accumulators and featured matches.</li></ul></article><article class="jm-col" data-jm-col="2"><p class="jm-step">03</p><h3 class="jm-title">Find the match</h3><div class="jm-pair"><figure><div class="jm-mini"><img src="/assets/551b21a442e9ea1f70dc837615103cc6.jpg" alt="Sky Bet: Find the match" data-zoom loading="lazy"></div><figcaption>Sky Bet</figcaption></figure><figure><div class="jm-mini"><img src="/assets/38dafad4b16ba011c34503eb03285141.jpg" alt="Betfair: Find the match" data-zoom loading="lazy"></div><figcaption>Betfair</figcaption></figure><figure><div class="jm-mini"><img src="/assets/df15c91785184ee1d97735e651c0730b.jpg" alt="Sky Bet today: Find the match" data-zoom loading="lazy"></div><figcaption>Sky Bet today</figcaption></figure></div><ul class="jm-notes"><li><span class="jm-tag jm-sb">Sky Bet</span>A long list of dedicated coupons, including All Matches By Day.</li><li><span class="jm-tag jm-bf">Betfair</span>No All Matches By Day, one of Sky Bet’s most-used journeys. Matches are found with filters instead.</li><li><span class="jm-tag jm-gap">Gap</span>Losing All Matches By Day was a clear risk for regular Sky Bet customers.</li><li><span class="jm-tag jm-td">Today</span>All Matches By Day is back as a quick link on the home page.</li></ul></article><article class="jm-col" data-jm-col="3"><p class="jm-step">04</p><h3 class="jm-title">Choose the day</h3><div class="jm-pair"><figure><div class="jm-mini"><img src="/assets/b612a61ca0b3f908e0685e135fa9b4f4.jpg" alt="Sky Bet: Choose the day" data-zoom loading="lazy"></div><figcaption>Sky Bet</figcaption></figure><figure><div class="jm-mini"><img src="/assets/e77c81f7ea08e3e9e66648c48cacac25.jpg" alt="Betfair: Choose the day" data-zoom loading="lazy"></div><figcaption>Betfair</figcaption></figure><figure><div class="jm-mini"><img src="/assets/09dcc8d3d2514801960b3185e3814243.jpg" alt="Sky Bet today: Choose the day" data-zoom loading="lazy"></div><figcaption>Sky Bet today</figcaption></figure></div><ul class="jm-notes"><li><span class="jm-tag jm-sb">Sky Bet</span>Every day is listed, so advance bets are quick to find.</li><li><span class="jm-tag jm-bf">Betfair</span>Filters cover today, tomorrow and the day after, then group everything later.</li><li><span class="jm-tag jm-win">Win</span>Filtering coupons by competition and market saves going back and forth.</li><li><span class="jm-tag jm-td">Today</span>Form and league position open under the match, without leaving the list.</li></ul></article><article class="jm-col" data-jm-col="4"><p class="jm-step">05</p><h3 class="jm-title">Add to bet slip</h3><div class="jm-pair"><figure><div class="jm-mini"><img src="/assets/4056bbd887d4ed1ffe2284b7b6cf9cdb.jpg" alt="Sky Bet: Add to bet slip" data-zoom loading="lazy"></div><figcaption>Sky Bet</figcaption></figure><figure><div class="jm-mini"><img src="/assets/bc7ff00a436a57631cf3a78eed39bc4e.jpg" alt="Betfair: Add to bet slip" data-zoom loading="lazy"></div><figcaption>Betfair</figcaption></figure><figure><div class="jm-mini"><img src="/assets/c932df97ef5cb6470a65b3431dac49ed.jpg" alt="Sky Bet today: Add to bet slip" data-zoom loading="lazy"></div><figcaption>Sky Bet today</figcaption></figure></div><ul class="jm-notes"><li><span class="jm-tag jm-sb">Sky Bet</span>The slip stays minimised, so you keep your place.</li><li><span class="jm-tag jm-bf">Betfair</span>The slip opens over half the screen as soon as you pick.</li><li><span class="jm-tag jm-research">Research</span>Customers preferred the quick bet slip minimised, so they control when it opens.<q class="jm-q">I can see everything I want all at once. I like to be able to control what pops up</q></li><li><span class="jm-tag jm-td">Today</span>Picks collect in a slim bar at the bottom, so you keep your place.</li></ul></article><article class="jm-col" data-jm-col="5"><p class="jm-step">06</p><h3 class="jm-title">Stake and place</h3><div class="jm-pair"><figure><div class="jm-mini"><img src="/assets/b1b6ef3020bf8748fa89dceaba4f3ee4.jpg" alt="Sky Bet: Stake and place" data-zoom loading="lazy"></div><figcaption>Sky Bet</figcaption></figure><figure><div class="jm-mini"><img src="/assets/fad8706874dde44c762793fa464b53da.jpg" alt="Betfair: Stake and place" data-zoom loading="lazy"></div><figcaption>Betfair</figcaption></figure><figure><div class="jm-mini"><img src="/assets/e01c5618ea98629ad7af139cf20e418a.jpg" alt="Sky Bet today: Stake and place" data-zoom loading="lazy"></div><figcaption>Sky Bet today</figcaption></figure></div><ul class="jm-notes"><li><span class="jm-tag jm-sb">Sky Bet</span>A full-screen slip that uses the phone’s keyboard.</li><li><span class="jm-tag jm-bf">Betfair</span>Quick stake buttons and a built-in keypad, carried through to the receipt.</li><li><span class="jm-tag jm-win">Win</span>Quick stakes save time, especially in-play, and work best when personalised.</li><li><span class="jm-tag jm-td">Today</span>A full-screen slip with quick stakes and a built-in keypad.</li></ul></article><article class="jm-col jm-end"><p class="jm-step">What it led to</p><h3 class="jm-title">Evidence for the second phase</h3><p class="jm-endp">Mapping every core journey this way gave us the evidence for what to bring back. It shaped the second phase: Sky Bet’s content hierarchy and the behaviour of the bet slip and My Bets.</p></article></div><div class="jm-ov-f"><button type="button" class="jm-btn" data-jm-act="mprev" aria-label="Previous step"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg></button><span class="jm-step">Scroll sideways to follow the journey</span><button type="button" class="jm-btn" data-jm-act="mnext" aria-label="Next step"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></button></div></div>
