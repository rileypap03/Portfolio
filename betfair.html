<section class="snap" style="display: flex; flex-direction: column; min-height: 0">

<p style="margin: 0; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em"><span aria-hidden="true" style="width: 8px; height: 8px; background: var(--accent)"></span>Case study · Betfair · 2018–2023</p>
<h1 data-reveal="r1" data-in="{{rv.r1}}" style="margin: 0; font-family: 'Geist', sans-serif; font-weight: 400; font-size: var(--fs-d); line-height: 1.0; letter-spacing: -0.02em; max-width: 1280px"><span class="w" style="--i:0">Leading</span> <span class="w" style="--i:1">design</span> <span class="w" style="--i:2">through</span> <span class="w" style="--i:3">a</span> <span class="w" style="--i:4">five-year</span> <span class="w" style="--i:5">rebuild</span> <span class="w" style="--i:6">of</span> <span class="w" style="--i:7">the</span> <span class="w" style="--i:8">Betfair</span> <span class="w" style="--i:9">app</span></h1>
<p style="margin: 0; max-width: 900px; font-family: 'Geist', sans-serif; font-size: var(--fs-2); line-height: 1.25; letter-spacing: -0.02em">How I led design through a five-year platform rebuild, from making the case to shareholders to a staged, customer-tested rollout, and what customers taught us about what to keep.</p>
</div>
<div class="sum" role="list" aria-label="Summary"><div role="listitem"><b>18</b><span>designers at peak, up from 6, including contractors</span></div><div role="listitem"><b>5 <small>years</small></b><span>of near-weekly testing with customers</span></div><div role="listitem"><b>1</b><span>person left the team in five years</span></div></div>
</section>

<section class="snap prose" aria-labelledby="ch-h">
<h2 id="ch-h" class="pr-h">The challenge</h2>
<p>Betfair’s platform could no longer take new features, so a rebuild was a technical necessity. The business saw a bigger opportunity: to make Betfair a home for sports fans, not just a place to bet, and earn some of the time customers spent in score, stats and club apps.</p>
</section>

<section class="snap prose" aria-labelledby="role-h">
<h2 id="role-h" class="pr-h">My role</h2>
<p class="pr-meta">Sports Product Design Manager</p><p>I led the sports design team, growing it from 6 to 18, and owned design direction for the programme. I presented progress weekly to the Managing Director of Product and monthly to the UK and Ireland CEO.</p>
</section>

<section class="snap her" aria-labelledby="her-h">
<p id="her-h" style="margin: 0; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em"><span aria-hidden="true" style="width: 8px; height: 8px; background: var(--accent)"></span>Where we started · The live Betfair app, 2020</p>
<ul class="her-row"><li><figure><div class="her-ph"><div class="her-sc"><img src="/assets/796ea652cfb9b488ed11a87f2c131a69.jpg" alt="Old Betfair Sportsbook app: a horse racing race card with a yellow header, race times and a Timeform tip" width="754" height="1340" loading="lazy"></div></div><figcaption>Sportsbook race card</figcaption></figure></li><li><figure><div class="her-ph"><div class="her-sc"><img src="/assets/a5fd96e5e2adee9bac1046afebee7d6f.jpg" alt="Old Betfair Exchange app: a horse racing market with back and lay prices in blue and pink" width="754" height="1340" loading="lazy"></div></div><figcaption>Exchange market</figcaption></figure></li><li><figure><div class="her-ph"><div class="her-sc"><img src="/assets/858521712e7630124390b3ff99ce56dc.jpg" alt="Old Betfair app Cash Out screen listing football bets with yellow cash out buttons" width="754" height="1340" loading="lazy"></div></div><figcaption>Cash out</figcaption></figure></li></ul>
</section>

<section class="snap prose" aria-labelledby="ap-h">
<h2 id="ap-h" class="pr-h">The approach</h2>
<ol class="pr-steps"><li><h3>Make the case</h3><p>Our CEO brought back a model from Meta: people use products leaning forward, leaning back or on the go. I used app data to map when customers were in each mode, and led three pitch films that won backing from shareholders and the executive team. At the town hall, the response was “why aren’t we doing this now?”</p></li><li><h3>Design end to end</h3><p>Workshops with Gaming and Customer teams, and patterns from banking and fintech apps for a clean, trustworthy feel.</p></li><li><h3>Test with real customers</h3><p>We tested with Betfair customers almost every week from 2018, on a working app on their own phones, then released to groups of customers, pausing whenever results surprised us.</p></li><li><h3>Adapt the strategy</h3><p>Partway through, new leadership reset the direction: a product closer to the one customers knew, with a refreshed UX and UI and a stable base to build on.</p></li></ol>
</section>

<section class="snap prose" aria-labelledby="cu-h">
<h2 id="cu-h" class="pr-h">What customers told us</h2>
<ol class="pr-steps"><li><h3>Both prices, one app</h3><p>Customers liked seeing Sportsbook and Exchange odds side by side, but needed help to find it.<q class="pr-q">Now I know how to use it I would definitely look for different odds on the Exchange.</q></p></li><li><h3>The default matters</h3><p>People bet on whichever side they landed on, so opening on Sportsbook removed friction.</p></li><li><h3>Explainers didn’t teach</h3><p>Videos made the Exchange feel friendlier but didn’t show people how to use it. Guidance needed to live in the product.</p></li></ol>
</section>

<section class="snap cq" aria-label="Customer quote"><figure><blockquote><p>“I think it’s far more user friendly than other apps that I use.”</p></blockquote><figcaption>Betfair customer, testing the rebuilt app · 2020</figcaption></figure></section>

<section class="snap prose" aria-labelledby="kd-h">
<h2 id="kd-h" class="pr-h">Key decision</h2>
<p class="pr-lead">Letting go of the destination idea.</p><p>Testing showed customers already had trusted homes for scores and stats, like the Premier League’s own apps. So we dropped videos, ambassador content, feeds and player pages, and kept what worked: the refreshed layouts, with the Betfair yellow used as a deliberate accent.</p><p>The brand team pushed back. I ran regular sessions with them and let the test results guide the decision.</p>
</section>

<ul class="her-row"><li><figure><div class="her-ph"><div class="her-sc"><img src="/assets/23dd02657fad85c4266d3932719238ec.jpg" alt="Rebuilt Betfair app home: sport shortcuts, an odds boost banner, featured events and popular bet builders" width="647" height="1400" loading="lazy"></div></div><figcaption>Home</figcaption></figure></li><li><figure><div class="her-ph"><div class="her-sc"><img src="/assets/62c583a4fbf0f5f5270c087142cf04e4.jpg" alt="Rebuilt Betfair app: Today's Football list with match result prices" width="647" height="1400" loading="lazy"></div></div><figcaption>Today’s Football</figcaption></figure></li><li><figure><div class="her-ph"><div class="her-sc"><img src="/assets/56dfc8465fb4f2f21ab5e3247bd9d134.jpg" alt="Rebuilt Betfair app betslip showing a bet builder and singles" width="647" height="1400" loading="lazy"></div></div><figcaption>Betslip</figcaption></figure></li></ul>
</section>

<section class="snap prose" aria-labelledby="lt-h">
<h2 id="lt-h" class="pr-h">Leading the team</h2>
<p class="pr-lead">Two first-job designers grew to senior and principal. One person left in five years.</p><p>I grew the sports design team from 6 to 18, including contractors, with roles from interns to leads. Designers owned key initiatives with my support, and grew through them.</p>
</section>

<section class="snap prose" aria-labelledby="kr-h">
<h2 id="kr-h" class="pr-h">Results</h2>
<dl class="pr-res"><div><dt>2020</dt><dd>The platform we built on was chosen as Flutter’s global sportsbook platform for all its betting brands. <a href="https://www.igamingbusiness.com/news/flutter-migrate-all-betting-brands-ppb-platform" target="_blank" rel="noopener">iGaming Business, Aug 2020<span class="sr-only"> (opens in new tab)</span></a></dd></div><div><dt>4.7 / 5</dt><dd>For the Betfair Sports app on the UK App Store, from more than 100,000 ratings. <a href="https://apps.apple.com/gb/app/betfair-sports-betting/id552024276" target="_blank" rel="noopener">App Store, Oct 2026<span class="sr-only"> (opens in new tab)</span></a></dd></div><div><dt>18</dt><dd>Designers in the sports team at peak, up from 6, including contractors.</dd></div><div><dt>1</dt><dd>Person who left the team in five years.</dd></div></dl><ul class="pr-list"><li>Set the design direction for a shared platform that Sky Bet later moved onto.</li><li>A stable, familiar product to build on, with cleaner layouts and a brand used with purpose.</li></ul>
</section>

<section class="snap prose" aria-labelledby="wl-h">
<h2 id="wl-h" class="pr-h">What I learned</h2>
<p class="pr-lead" data-reveal="r2" data-in="{{rv.r2}}">Let customer evidence challenge the vision. People already had homes for sports content; the win was knowing what to keep.</p>
</section>

<section class="snap prose pr-end" aria-labelledby="dd-h">
<h2 id="dd-h" class="pr-h">What I’d do differently</h2>
<p>I’d have worked more closely with engineering from the start, so the vision and the platform’s limits met earlier.</p>
</section>
